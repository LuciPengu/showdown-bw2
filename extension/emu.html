<!doctype html>
<!--
  The emulator frame in the extension: core-files.js lets EmulatorJS load its
  core from files (extension pages can't run blob: scripts), then emu-boot.js
  starts it. Its own buttons and menus stay hidden; Showdown has its own.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BW2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      .ejs_menu_bar, .ejs_context_menu, .ejs_virtualGamepad_parent, .ejs_message { display: none !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script src="core-files.js"></script>
    <script src="emu-boot.js"></script>
  </body>
</html>
