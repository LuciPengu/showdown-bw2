<!doctype html>
<!--
  The emulator frame. EmulatorJS is configured through window globals and runs
  one instance per page, so it lives in this same-origin iframe. The app puts
  { rom: ArrayBuffer, onStatus(text) } on its own window as __emuBoot first.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BW2</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #game { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      const boot = window.parent.__emuBoot;
      const status = (text) => boot?.onStatus?.(text);
      if (!boot?.rom) {
        document.body.style.color = '#fff';
        document.body.textContent = 'Open this from the app.';
      } else {
        // The game has to keep running while you watch your Showdown tab. RetroArch pauses a page it
        // sees as hidden, so it's told the page is always visible. Browsers also stop animation frames
        // in a hidden page; the core asks for each frame through this global, so while the page is
        // really hidden, frames come from a timer (a page playing sound keeps its timers at full speed).
        const reallyHidden = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden').get.bind(document);
        Object.defineProperty(document, 'hidden', { get: () => false });
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        document.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);
        const nativeFrame = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = (callback) =>
          reallyHidden() ? setTimeout(() => callback(performance.now()), 1000 / 60) : nativeFrame(callback);
        window.EJS_player = '#game';
        window.EJS_core = 'melonds';
        window.EJS_gameName = 'showdown-bw2.nds';
        // A view made in this frame's realm: EmulatorJS checks instanceof, which fails across frames.
        window.EJS_gameUrl = new Uint8Array(boot.rom);
        window.EJS_pathtodata = '/emulatorjs/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_disableDatabases = true;
        window.EJS_backgroundColor = '#000';
        window.EJS_language = 'en-US';
        // Clicks land on the touch screen where they're made (the core's default is a relative mouse cursor).
        window.EJS_defaultOptions = { melonds_touch_mode: 'Touch' };
        window.EJS_onGameStart = () => {
          window.EJS_gameUrl = null; // the core has its own copy
          status('started');
        };
        const script = document.createElement('script');
        script.src = '/emulatorjs/data/loader.js';
        document.body.append(script);
        status('loading');
      }
    </script>
  </body>
</html>
